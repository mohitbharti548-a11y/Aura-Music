[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NETLIFY_DEPLOY_PREVIEWS = "false"
  DISABLE_NETLIFY_BADGE = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Never cache Service Worker or Version API so in-app update checks are instantaneous
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/api/version"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
