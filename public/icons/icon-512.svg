<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Vibrant Deep Radiant Amethyst-to-Indigo -->
    <linearGradient id="aura-bg-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="50%" stop-color="#0f0c24" />
      <stop offset="100%" stop-color="#0b1736" />
    </linearGradient>

    <!-- Glowing Prismatic Aurora Gradient -->
    <linearGradient id="aura-grad-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#818cf8" />
      <stop offset="65%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Crossbar Floating Beam Gradient -->
    <linearGradient id="aura-crossbar" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Harmonic Sound Wave Gradient -->
    <linearGradient id="aura-wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="aura-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Intense Core Glow Filter -->
    <filter id="core-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Rounded Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#aura-bg-512)" stroke="rgba(255,255,255,0.22)" stroke-width="3.5" />

  <!-- Ambient Radiant Halo in Background -->
  <circle cx="256" cy="245" r="140" fill="url(#aura-grad-a)" opacity="0.16" filter="url(#aura-glow)" />

  <!-- Surrounding Harmonic Soundwaves & Frequency Orbitals -->
  <g opacity="0.85" filter="url(#aura-glow)">
    <!-- Outer Sonic Harmonic Orbital Rings -->
    <circle cx="256" cy="256" r="185" fill="none" stroke="url(#aura-grad-a)" stroke-width="3" stroke-dasharray="8 14 32 14" opacity="0.45" />
    <circle cx="256" cy="256" r="155" fill="none" stroke="url(#aura-wave-grad)" stroke-width="2.5" stroke-dasharray="16 20" opacity="0.6" />

    <!-- Left Harmonic Audio Waveform Arc -->
    <path d="M 105 285 C 90 240, 95 185, 130 145 C 160 110, 205 92, 256 92" fill="none" stroke="url(#aura-grad-a)" stroke-width="5" stroke-linecap="round" opacity="0.75" />
    <path d="M 75 270 C 65 210, 95 145, 145 105" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.5" />

    <!-- Right Harmonic Audio Waveform Arc -->
    <path d="M 407 285 C 422 240, 417 185, 382 145 C 352 110, 307 92, 256 92" fill="none" stroke="url(#aura-grad-a)" stroke-width="5" stroke-linecap="round" opacity="0.75" />
    <path d="M 437 270 C 447 210, 417 145, 367 105" fill="none" stroke="#f472b6" stroke-width="3.5" stroke-linecap="round" opacity="0.5" />

    <!-- Harmonic Sound Equalizer Bars Around Base Orbit -->
    <line x1="88" y1="350" x2="88" y2="330" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <line x1="102" y1="365" x2="102" y2="315" stroke="#818cf8" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    <line x1="116" y1="380" x2="116" y2="335" stroke="#c084fc" stroke-width="4" stroke-linecap="round" opacity="0.8" />

    <line x1="424" y1="350" x2="424" y2="330" stroke="#f472b6" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <line x1="410" y1="365" x2="410" y2="315" stroke="#e879f9" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    <line x1="396" y1="380" x2="396" y2="335" stroke="#c084fc" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Center Master "A" with DISCONNECTED / FLOATING Crossbar -->
  <g filter="url(#core-glow)">
    <!-- Main Left Diagonal Leg of "A" -->
    <path d="M 148 375 L 236 142 C 242 126, 248 120, 256 120 C 264 120, 270 126, 276 142 L 364 375" 
          fill="none" 
          stroke="url(#aura-grad-a)" 
          stroke-width="34" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Inner Apex Spark / Core Flare -->
    <circle cx="256" cy="122" r="7" fill="#ffffff" />

    <!-- Floating / Disconnected Crossbar of "A" (Does NOT connect to left & right legs) -->
    <!-- Distance between legs at Y=280 is approx X=196 to X=316. Crossbar spans X=216 to X=296 with a sonic wave pulse -->
    <g filter="url(#aura-glow)">
      <!-- Disconnected Floating Soundwave Pill / Crossbar -->
      <path d="M 218 282 Q 237 270, 256 282 T 294 282" 
            fill="none" 
            stroke="url(#aura-crossbar)" 
            stroke-width="18" 
            stroke-linecap="round" />
      <!-- Luminous Center Bead on Floating Crossbar -->
      <circle cx="256" cy="282" r="5.5" fill="#ffffff" />
    </g>
  </g>

  <!-- Orbital Micro-Stars / Sonic Energy Resonators -->
  <circle cx="168" cy="118" r="4.5" fill="#38bdf8" opacity="0.9" />
  <circle cx="344" cy="118" r="4.5" fill="#f472b6" opacity="0.9" />
  <circle cx="256" cy="62" r="4" fill="#ffffff" opacity="0.8" />
</svg>
