<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="aura-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="aura-cross-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Surrounding Harmonic Sound Arcs -->
  <g opacity="0.85" filter="url(#logo-glow)">
    <path d="M 22 55 C 18 45, 20 32, 30 25 C 38 18, 45 16, 50 16" fill="none" stroke="url(#aura-logo-grad)" stroke-width="2.2" stroke-linecap="round" opacity="0.8" />
    <path d="M 78 55 C 82 45, 80 32, 70 25 C 62 18, 55 16, 50 16" fill="none" stroke="url(#aura-logo-grad)" stroke-width="2.2" stroke-linecap="round" opacity="0.8" />
    <circle cx="50" cy="50" r="44" fill="none" stroke="url(#aura-logo-grad)" stroke-width="1.2" stroke-dasharray="3 6 12 6" opacity="0.4" />
  </g>

  <!-- 'A' with Disconnected / Floating Crossbar -->
  <g filter="url(#logo-glow)">
    <path d="M 27 75 L 46 25 C 47 22, 49 21, 50 21 C 51 21, 53 22, 54 25 L 73 75" 
          fill="none" 
          stroke="url(#aura-logo-grad)" 
          stroke-width="7.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Disconnected Crossbar -->
    <path d="M 42 56 Q 46 53, 50 56 T 58 56" 
          fill="none" 
          stroke="url(#aura-cross-grad)" 
          stroke-width="4.2" 
          stroke-linecap="round" />
    <circle cx="50" cy="56" r="1.4" fill="#ffffff" />
  </g>
</svg>
